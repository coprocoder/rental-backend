# Сервисы для локальной разработки.
#
# Приложение по умолчанию запускается на хосте (`npm run dev`) — так HMR
# работает без проблем с проброской файловой системы. Полностью контейнерный
# режим: docker-compose.app.yml (см. Makefile, цель `app`).
#
# Порты наружу нестандартные, чтобы не конфликтовать с сервисами,
# которые уже могут стоять на машине.

name: rental

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
      POSTGRES_DB: rental
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Без -U и -d проверка ходит под postgres и врёт о готовности нужной БД.
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    # ⚠️ ЗАДЕЛ: приложение к Redis НЕ подключается (TODO 17.28).
    # Очередь эффектов — таблица outbox в Postgres, её разбирает
    # scripts/worker.ts; источником правды она и останется, потому что
    # Redis не участвует в транзакции (см. server/domain/core/outbox.ts).
    # Планируется как ускорение доставки и rate limiting по api_key.
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio:
    # ⚠️ ЗАДЕЛ: приложение в S3 ничего не пишет (TODO 17.29).
    # Файлов пока нет: договор подписывается токеном, фотофиксация — 17.7.
    # S3-совместимое хранилище только для разработки.
    # В проде — Selectel или Yandex Object Storage: данные россиян в РФ.
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # Создаёт бакет один раз. Идемпотентно: --ignore-existing.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/rental &&
      echo 'bucket ready'
      "
    restart: "no"

  mailpit:
    # Перехватывает всю исходящую почту: с машины разработчика
    # физически не может улететь письмо реальному клиенту.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "58025:8025"   # веб-интерфейс
      - "51025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pgdata:
  miniodata:
